prefixes:
  ex: https://w3id.org/ogc/demo/observable/

examples:
  - title: VectorObservation - specialisation example.
    base-output-filename: observation
    content:
      Example of Specialised Observation being a vector, using GeoPose as part of a complex result.
  
      View [live example](https://defs-dev.opengis.net/bblocks-pygeoapi/collections/ogc.bbr.examples.observation.vectorObservationFeature/items/vector-obs-1) - using PyGeoAPI, configured to use this BuildingBlock to provide a JSON-LD context, and a client Linked Data library.

    base-uri: http://example.com/features/
    snippets:
      - language: json
        ref: examples/observation.json

  - title: VectorObservationCollection
    base-output-filename: observationCollection
    content:
      Example of Specialised ObservationCollection being a vector, using GeoPose as part of a complex result

    base-uri: http://example.com/features/
    snippets:
      - language: json
        ref: examples/observationCollection.json

  - title: VectorObservation Feature from a collection, with its own observedProperty
    base-output-filename: observationInline
    base-uri: http://example.com/features/
    snippets:
      - language: json
        code: |
          {
            "id": "vector-obs-1",
            "type": "Feature",
            "geometry": {
              "type": "LineString",
              "coordinates": [
                [
