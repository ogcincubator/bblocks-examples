"$schema": https://json-schema.org/draft/2020-12/schema
description: 'Example SOSA Observation Specialisation - a vector bearing and distance'
$defs:
  VectorObservation:
    allOf:
      - $ref: bblocks://ogc.sosa.features.observation
      - type: object
        properties:
          properties:
            $ref: ../vectorObservation/schema.yaml
  VectorObservationMember:
    allOf:
      - $ref: bblocks://ogc.sosa.features.observation#/$defs/member
      - type: object
        properties:
          properties:
            $ref: ../vectorObservation/schema.yaml#/$defs/member
  VectorObservationCollection:
    allOf:
      - $ref: bblocks://ogc.sosa.features.observationCollection
      - type: object
        properties:
          features:
            type: array
            items:
              $ref: "#/$defs/VectorObservationMember"
anyOf:
  - $ref: "#/$defs/VectorObservation"
  - $ref: "#/$defs/VectorObservationCollection"
