"$schema": https://json-schema.org/draft/2020-12/schema
description: 'Example SOSA Vector Observation'
$defs:
  VectorResult:
    type: object
    properties:
      hasResult:
        properties:
          pose:
            $ref: bblocks://ogc.geo.geopose.basic.ypr
          distance:
            type: number
    required:
      - hasResult
    not:
      required:
        - hasSimpleResult
  member:
    description: A Vector Observation in an ObservationCollection (observed property etc. may be provided by the collection)
    allOf:
      - $ref: https://opengeospatial.github.io/ogcapi-sosa/build/annotated/sosa/properties/observation/schema.yaml#/$defs/member
      - $ref: '#/$defs/VectorResult'
allOf:
  - $ref: https://opengeospatial.github.io/ogcapi-sosa/build/annotated/sosa/properties/observation/schema.yaml
  - $ref: '#/$defs/VectorResult'
