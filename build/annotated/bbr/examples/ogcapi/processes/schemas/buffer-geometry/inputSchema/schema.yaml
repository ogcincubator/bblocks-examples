type: object
required:
- geometry
- distance
properties:
  geometry:
    allOf:
    - $ref: https://opengeospatial.github.io/bblocks/annotated-schemas/geo/common/data_types/geojson/schema.yaml
    - required:
      - type
      - coordinates
      properties:
        type:
          enum:
          - Point
          - LineString
          - polygon
  distance:
    type: object
    properties:
      type:
        type: string
        example: number
      minimum:
        type: number
        example: 0
  units:
    $ref: https://opengeospatial.github.io/bblocks/annotated-schemas/ogc-utils/iri-or-curie/schema.yaml
    enum:
    - meters
    - kilometers
    - feet
    - miles
    default: meters
x-bblocks-metadata:
  itemIdentifier: ogc.bbr.examples.ogcapi.processes.schemas.buffer-geometry.inputSchema
  register: https://rob-metalinkage.github.io/bblocks-examples/build/register.json
  version: '1.0'
  dateOfLastChange: '2026-11-03'
